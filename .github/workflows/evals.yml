name: Evals
on:
  pull_request:
  push:
    branches: [main]

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --example evalworker
      # The tinyeval command at the version in Cargo.lock; rust-cache keeps it between runs.
      - run: cargo install tinyeval --locked --version "$(cargo pkgid tinyeval | cut -d@ -f2)"
      - run: tinyeval -n 3
        if: env.ANTHROPIC_API_KEY != ''
      - run: echo "::notice::Evals skipped. Add the ANTHROPIC_API_KEY repository secret to run them."
        if: env.ANTHROPIC_API_KEY == ''
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: eval-results.json
